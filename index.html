<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>특수교육행정 시뮬레이터 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .app-frame { display: none; width: 100%; height: calc(100vh - 60px); border: none; }
        .app-frame.active { display: block; }
    </style>
</head>
<body class="overflow-hidden bg-slate-800">
    <header class="h-[60px] bg-slate-900 flex items-center px-6 shadow-md border-b border-slate-700">
        <div class="text-white font-black text-lg mr-8 flex items-center gap-2">
            특수교육 통합 시뮬레이터
        </div>
        <nav class="flex gap-2 items-center">
            <button onclick="changeTab('v22')" id="tab-v22" class="tab-btn px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-sm transition-all flex items-center gap-1">
                개별 배치 (V22)
            </button>
            <button onclick="changeTab('c5')" id="tab-c5" class="tab-btn px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1">
                신증설 시뮬 (C5)
            </button>
            
            <div class="flex items-center gap-1">
                <button onclick="changeTab('dist')" id="tab-dist" class="tab-btn px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1">
                    거리 계산 앱
                </button>
                <a href="https://school-distance-finder-hgmgxrr5yjifbggyjt9vdt.streamlit.app/" target="_blank" class="px-2 py-1.5 rounded-lg text-[11px] font-bold bg-slate-700 text-amber-400 hover:bg-slate-600 border border-slate-600 shadow-sm transition-all flex items-center gap-1" title="거리 계산 앱 화면이 표시되지 않으면 클릭하여 새 창에서 엽니다">
                    <i class="fa-solid fa-up-right-from-square"></i> 새창 열기
                </a>
            </div>
            
            <div class="w-px h-5 bg-slate-700 mx-2"></div>
            
            <button onclick="changeTab('download')" id="tab-download" class="tab-btn px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1">
                <i class="fa-solid fa-cloud-arrow-down"></i> 양식 다운로드
            </button>
        </nav>
    </header>

    <main>
        <iframe src="v22.html" id="frame-v22" class="app-frame active"></iframe>
        <iframe src="c5.html" id="frame-c5" class="app-frame"></iframe>
        <iframe src="https://school-distance-finder-hgmgxrr5yjifbggyjt9vdt.streamlit.app/?embed=true" id="frame-dist" class="app-frame"></iframe>
        <iframe src="download.html" id="frame-download" class="app-frame"></iframe>
    </main>

    <script>
        function changeTab(targetId) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1";
            });
            
            const activeBtn = document.getElementById('tab-' + targetId);
            if (targetId === 'v22') activeBtn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-sm transition-all flex items-center gap-1";
            if (targetId === 'c5') activeBtn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-bold bg-teal-600 text-white shadow-sm transition-all flex items-center gap-1";
            if (targetId === 'dist') activeBtn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-bold bg-amber-600 text-white shadow-sm transition-all flex items-center gap-1";
            if (targetId === 'download') activeBtn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-bold bg-rose-600 text-white shadow-sm transition-all flex items-center gap-1";

            document.querySelectorAll('.app-frame').forEach(frame => {
                frame.classList.remove('active');
            });
            
            document.getElementById('frame-' + targetId).classList.add('active');
        }
    </script>
</body>
</html>
